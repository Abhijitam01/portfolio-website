<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090f"/>
      <stop offset="100%" stop-color="#141427"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#9b5de5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bg)"/>
  <path d="M6 38 L122 20" stroke="#00f5d4" stroke-opacity=".14" stroke-width="2"/>
  <path d="M6 104 L122 86" stroke="#9b5de5" stroke-opacity=".14" stroke-width="2"/>

  <g transform="translate(64 64)">
    <text
      x="0"
      y="20"
      text-anchor="middle"
      font-size="82"
      font-family="Arial Black, Arial, sans-serif"
      font-weight="900"
      fill="#00f5d4"
      fill-opacity=".35"
      transform="translate(-3 2)"
    >A</text>
    <text
      x="0"
      y="20"
      text-anchor="middle"
      font-size="82"
      font-family="Arial Black, Arial, sans-serif"
      font-weight="900"
      fill="#ff006e"
      fill-opacity=".22"
      transform="translate(3 -2)"
    >A</text>
    <text
      x="0"
      y="20"
      text-anchor="middle"
      font-size="82"
      font-family="Arial Black, Arial, sans-serif"
      font-weight="900"
      fill="url(#accent)"
      stroke="#ffffff"
      stroke-opacity=".2"
      stroke-width=".8"
      filter="url(#glow)"
    >A</text>
  </g>
</svg>
